<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3926424153972712" crossorigin="anonymous"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Musical Symbol Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Music&display=block" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-PXN4TKZH"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<body>
  <header>
    <h1>音楽記号メーカー</h1>
    <p>記号と色を選んで、画像として保存できます。</p>
  </header>

  <main>
    <section class="panel">
      <h2>1. 記号を選ぶ</h2>
      <div id="symbol-groups"></div>
    </section>

    <section class="panel">
      <h2>2. 色を選ぶ</h2>
      <div class="color-row">
        <input type="color" id="color-picker" value="#e91e63" aria-label="カラーピッカー">
        <input type="text" id="color-hex" value="#e91e63" maxlength="7" spellcheck="false" aria-label="カラーコード">
      </div>
      <div id="presets" class="presets"></div>

      <h2>3. オプション</h2>
      <label class="option">
        <span>サイズ <span id="size-value">256</span>px</span>
        <input type="range" id="size" min="64" max="1024" step="16" value="256">
      </label>
      <label class="option">
        背景
        <select id="background">
          <option value="transparent">透明</option>
          <option value="#ffffff">白</option>
          <option value="#000000">黒</option>
        </select>
      </label>
    </section>

    <section class="panel preview-panel">
      <h2>プレビュー</h2>
      <div class="preview-box checker">
        <canvas id="preview"></canvas>
      </div>
      <p id="symbol-name" class="symbol-name"></p>
      <button id="download" type="button">PNGをダウンロード</button>
    </section>
  </main>

  <script src="symbols.js"></script>
  <script src="main.js"></script>
</body>
</html>
